<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>VentMon MQTT</title><link rel="stylesheet" href="/css/mqtt.css"></head><body><main><h2>MQTT configuration</h2><p><a href="/">Back to visualizer</a></p><div class="card"><label><input type="checkbox" id="mqttEnabled"> MQTT enabled</label><label>MQTT host<input id="mqttHost"></label><label>MQTT port<input id="mqttPort" type="number"></label><label>MQTT user<input id="mqttUser"></label><label>MQTT password<input id="mqttPassword" type="password"></label><label>Device name<input id="deviceName"></label></div><div class="card"><h3>Publish topics</h3><p>Safety rule: this device publishes only VentMon measurement updates where <code>event</code> is <code>M</code>, plus explicit custom alarms. No WiFi, IP, heartbeat, status, RSSI, or device-info messages are published to MQTT.</p><div id="topics"></div><button onclick="addTopic()">+ Add topic</button><button onclick="save()">Save MQTT settings</button></div></main><script src="/js/mqtt.js"></script></body></html>
